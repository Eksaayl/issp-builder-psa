<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" text-rendering="geometricPrecision">
  <title>Civil Service Commission (CSC) — Enterprise Architecture (ISSP FY 2028–2030, Part III-B)</title>
  <desc>Sample four-layer enterprise architecture reference diagram for the Civil Service Commission: Strategic Outcomes; Business, Application, Data and Technology architecture; with cross-cutting Security &amp; Privacy and Governance &amp; Interoperability rails.</desc>

  <!-- Canvas -->
  <rect x="0" y="0" width="1200" height="820" fill="#FAFAF7"/>

  <!-- ============ TITLE BLOCK ============ -->
  <text x="36" y="62" font-size="24" font-weight="700" fill="#18181B">Civil Service Commission (CSC)</text>
  <text x="36" y="84" font-size="12.5" fill="#52525B">Enterprise Architecture · Information Systems Strategic Plan FY 2028–2030 · Part III-B</text>
  <!-- CSC badge -->
  <rect x="1052" y="40" width="112" height="42" rx="7" fill="#FFFFFF" stroke="#bbf7d0" stroke-width="1"/>
  <text x="1108" y="60" text-anchor="middle" font-size="15" font-weight="700" fill="#15803D">CSC</text>
  <text x="1108" y="74" text-anchor="middle" font-size="8.5" fill="#52525B">Government Agency</text>
  <line x1="36" y1="96" x2="1164" y2="96" stroke="#E5E3DC" stroke-width="1"/>

  <!-- ============ STRATEGIC OUTCOMES BAND ============ -->
  <rect x="32" y="104" width="1136" height="74" rx="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="52" y="124" font-size="10" font-weight="700" fill="#15803D" letter-spacing="1">STRATEGIC OUTCOMES</text>
  <text x="52" y="144" font-size="12" font-weight="600" fill="#18181B">Vision 2030 — a leader in public-sector HR &amp; organizational development</text>
  <text x="52" y="162" font-size="10.5" font-style="italic" fill="#52525B">Mission: “Gawing Lingkod-Bayani ang Bawat Kawani” — every public servant a hero of service.</text>
  <!-- outcome chips -->
  <g>
    <rect x="624" y="124" width="128" height="30" rx="6" fill="#FFFFFF" stroke="#bbf7d0" stroke-width="1"/>
    <text x="688" y="143" text-anchor="middle" font-size="10.5" fill="#18181B">Professionalized HR</text>
    <rect x="760" y="124" width="128" height="30" rx="6" fill="#FFFFFF" stroke="#bbf7d0" stroke-width="1"/>
    <text x="824" y="143" text-anchor="middle" font-size="10.5" fill="#18181B">Citizen Trust</text>
    <rect x="896" y="124" width="128" height="30" rx="6" fill="#FFFFFF" stroke="#bbf7d0" stroke-width="1"/>
    <text x="960" y="143" text-anchor="middle" font-size="10.5" fill="#18181B">Org Development</text>
    <rect x="1032" y="124" width="128" height="30" rx="6" fill="#FFFFFF" stroke="#bbf7d0" stroke-width="1"/>
    <text x="1096" y="143" text-anchor="middle" font-size="10.5" fill="#18181B">Digital Services</text>
  </g>

  <!-- connector SO -> layers -->
  <path d="M594,180 L606,180 L600,190 Z" fill="#15803D"/>

