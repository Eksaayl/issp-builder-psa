  <rect x="32" y="192" width="96" height="582" rx="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <path d="M80,208 l12,5 v10 q0,9 -12,14 q-12,-5 -12,-14 v-10 z" fill="none" stroke="#15803D" stroke-width="1.4"/>
  <path d="M74,221 l4,4 l8,-9" fill="none" stroke="#15803D" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
  <text transform="rotate(-90 80 490)" x="80" y="490" text-anchor="middle" dominant-baseline="middle" font-size="13" font-weight="700" fill="#15803D" letter-spacing="1.5">SECURITY &amp; PRIVACY</text>

