    <rect x="757" y="562" width="56" height="22" rx="5" fill="#FFFFFF" stroke="#E5E3DC" stroke-width="1"/><text x="785" y="573" text-anchor="middle" dominant-baseline="middle" font-size="9.5" fill="#18181B">GSIS</text>
    <rect x="817" y="562" width="56" height="22" rx="5" fill="#FFFFFF" stroke="#E5E3DC" stroke-width="1"/><text x="845" y="573" text-anchor="middle" dominant-baseline="middle" font-size="9.5" fill="#18181B">SSS</text>
