  <rect x="1072" y="192" width="96" height="582" rx="8" fill="#EAE8E1" stroke="#E5E3DC" stroke-width="1"/>
  <g stroke="#18181B" stroke-width="1.2" fill="#18181B">
    <line x1="1112" y1="210" x2="1128" y2="210"/>
    <line x1="1112" y1="210" x2="1112" y2="226"/>
    <line x1="1128" y1="210" x2="1128" y2="226"/>
