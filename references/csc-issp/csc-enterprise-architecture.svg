    <rect x="945" y="562" width="56" height="22" rx="5" fill="#FFFFFF" stroke="#E5E3DC" stroke-width="1"/><text x="973" y="573" text-anchor="middle" dominant-baseline="middle" font-size="9.5" fill="#18181B">COA</text>
    <rect x="1005" y="562" width="56" height="22" rx="5" fill="#FFFFFF" stroke="#E5E3DC" stroke-width="1"/><text x="1033" y="573" text-anchor="middle" dominant-baseline="middle" font-size="9.5" fill="#18181B">iGovPH</text>
  </g>

